root = "~/src"

[keys]
leader = "M-p"
kids = "M-P"
actions = "M-x"

[ai]
default = "grok"
local = "ollama"

[dashboard]
direction = "vertical"

[[dashboard.pane]]
size = 66

[[dashboard.pane]]
size = 34
sub = "50/50"

[[favorites]]
label = "src"
path = "~/src"
keys = "r"

[[favorites]]
label = "symworx"
path = "~/src/symworx"
keys = "s"

# Key t replaces the built-in session row (plain tmux for the current directory).
# Use "sjmp_tmux '{path}'" to pick a favorite first.
# Key a replaces the built-in agent row (sjmp_tmux_here for $PWD).
# Use "sjmp_tmux_dash '{path}'" to pick a favorite first.
# Key w replaces the built-in panes row. Any [[panes]] entry replaces
# the built-in 2x2, 2x3, and 3x2 grids. cols is left | right. rows is top / bottom.
# [[windows]] still loads.

[[panes]]
label = "2x2"
cols = 2
rows = 2

[[panes]]
label = "2x3"
cols = 2
rows = 3

[[panes]]
label = "3x2"
cols = 3
rows = 2
[[actions.agent]]
label = "tmux"
keys = "t"
cmd = "sjmp_tmux"

[[actions.toolbox]]
label = "python"
name = "dev-python"
keys = "p"

[[actions.agent]]
label = "agent"
keys = "a"
cmd = "sjmp_tmux_here"

[[actions.agent]]
label = "ollama"
keys = "l"
cmd = "sjmp_tmux_dash '{path}' local"

[[actions.agent]]
label = "grok-build"
keys = "g"
cmd = "grok"

[[actions.agent]]
label = "codex"
keys = "c"
cmd = "codex -C {path}"
