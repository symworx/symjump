root = "~/worx"

[keys]
leader = "M-p"
kids = "M-P"
verbs = "M-x"

[[favorites]]
label = "worx"
path = "~/worx"
keys = "w"

[[favorites]]
label = "symworx"
path = "~/worx/symworx"
