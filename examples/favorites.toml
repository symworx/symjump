root = "~/src"

[keys]
leader = "M-p"
kids = "M-P"
actions = "M-x"

[ai]
default = "grok"
local = "ollama"

[[favorites]]
label = "src"
path = "~/src"
keys = "r"

[[favorites]]
label = "symworx"
path = "~/src/symworx"
keys = "s"

# Plain tmux for the current directory. Use "sjmp_tmux '{path}'" to pick a favorite.
[[actions.agent]]
label = "tmux"
keys = "t"
cmd = "sjmp_tmux"

[[actions.toolbox]]
label = "python"
name = "dev-python"
keys = "p"

[[actions.agent]]
label = "agent"
keys = "a"
cmd = "sjmp_tmux_dash '{path}'"

[[actions.agent]]
label = "ollama"
keys = "l"
cmd = "sjmp_tmux_dash '{path}' local"

[[actions.agent]]
label = "grok-build"
keys = "g"
cmd = "grok"

[[actions.agent]]
label = "codex"
keys = "c"
cmd = "codex -C {path}"
