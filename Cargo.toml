[workspace]
resolver = "2"
members = [
    "crates/symjump-config",
    "crates/symjump-core",
    "crates/sjmp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/symworx/symjump"

[workspace.dependencies]
symjump-config = { path = "crates/symjump-config", version = "0.1.0" }
symjump-core = { path = "crates/symjump-core", version = "0.1.0" }
serde = { version = "=1.0.197", features = ["derive"] }
toml = "=0.5.11"
thiserror = "=1.0.50"
